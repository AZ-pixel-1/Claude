# ─────────────────────────────────────────────────────────────
# READ-ONLY reverse proxy for IB Client Portal API
# ─────────────────────────────────────────────────────────────
# ONLY whitelisted read endpoints are allowed.
# ALL order/trade/modification endpoints are blocked (403).
# ─────────────────────────────────────────────────────────────

worker_processes 1;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 64;
}

http {
    log_format main '$remote_addr [$time_local] "$request" $status';
    access_log /var/log/nginx/access.log main;

    upstream ibeam {
        server ibeam:5000;
    }

    server {
        listen 5500 ssl;

        # Self-signed cert (generated at container startup)
        ssl_certificate     /etc/nginx/ssl/proxy.crt;
        ssl_certificate_key /etc/nginx/ssl/proxy.key;

        # ── BLOCK EVERYTHING BY DEFAULT ──
        # Any endpoint not explicitly allowed below returns 403
        location / {
            return 403 '{"error": "BLOCKED — read-only mode, trading is disabled"}';
            add_header Content-Type application/json always;
        }

        # ── ALLOWED: Authentication ──
        location /v1/api/iserver/auth/status {
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }
        location /v1/api/iserver/auth/ssodh/init {
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }

        # ── ALLOWED: Account info (read-only) ──
        location /v1/api/iserver/accounts {
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }
        location /v1/api/one/user {
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }

        # ── ALLOWED: Portfolio (read-only) ──
        location /v1/api/portfolio {
            # Allow GET only — block POST/PUT/DELETE
            limit_except GET {
                deny all;
            }
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }

        # ── ALLOWED: Market data (read-only) ──
        location /v1/api/iserver/marketdata/snapshot {
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }
        location /v1/api/iserver/marketdata/history {
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }
        location /v1/api/iserver/marketdata/unsubscribeall {
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }
        location /v1/api/md/ {
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }

        # ── ALLOWED: Security definitions / search (read-only) ──
        location /v1/api/iserver/secdef/ {
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }
        location /v1/api/trsrv/ {
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }

        # ── ALLOWED: Contract info (read-only) ──
        location /v1/api/iserver/contract/ {
            limit_except GET {
                deny all;
            }
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }

        # ── ALLOWED: Scanner (read-only) ──
        location /v1/api/iserver/scanner/ {
            proxy_pass https://ibeam;
            proxy_ssl_verify off;
        }

        # ──────────────────────────────────────────────────────
        # EXPLICITLY BLOCKED (redundant with default, but clear)
        # ──────────────────────────────────────────────────────
        # /v1/api/iserver/account/*/orders  → place orders
        # /v1/api/iserver/account/*/order   → modify/cancel
        # /v1/api/iserver/reply/*           → confirm orders
        # /v1/api/iserver/account/orders    → preview/place
        # /v1/api/ccp/order                 → crypto orders
        # /v1/api/fyi/                      → notifications
        # ALL other endpoints               → blocked by default
    }
}
